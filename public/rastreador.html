<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rastreamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex flex-wrap justify-between items-center gap-3">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">Painel de Capturas &amp; Rota</h1>
                <p id="resumo-rota" class="text-xs text-gray-400 mt-1">Aguardando coordenadas para desenhar a rota...</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <select id="filtro-sessao" onchange="renderizarTudo()" class="bg-gray-800 border border-gray-700 text-xs rounded-lg px-3 py-2 text-gray-200">
                    <option value="TODAS">Todas as sessões</option>
                </select>
                <button onclick="carregarRegistros()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition">Atualizar</button>
                <button onclick="limparRegistros()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition">Limpar Histórico</button>
            </div>
        </div>

        <!-- Mapa da Rota -->
        <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-gray-300">
                <span class="font-semibold text-emerald-400 uppercase tracking-wider">Trajeto em Tempo Real</span>
                <span id="info-pontos" class="font-mono text-gray-400">0 pontos na rota</span>
            </div>
            <div id="mapa-rota" class="w-full h-96 rounded-lg overflow-hidden border border-gray-700 z-0"></div>
        </div>

        <!-- Tabela Histórica -->
        <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 uppercase text-xs">
                        <tr>
                            <th class="p-4">Data/Hora</th>
                            <th class="p-4">Sessão</th>
                            <th class="p-4">Latitude / Longitude</th>
                            <th class="p-4">IP / Dispositivo</th>
                            <th class="p-4">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="divide-y divide-gray-700">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-400">Carregando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let todosRegistros = [];
        let mapa = null;
        let camadaRota = null;
        let marcadorAtual = null;
        let centralizadoUmaVez = false;

        function inicializarMapa() {
            if (mapa) return;
            mapa = L.map('mapa-rota').setView([-23.96, -46.33], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(mapa);
            camadaRota = L.layerGroup().addTo(mapa);
        }

        function atualizarSeletorSessoes() {
            const select = document.getElementById('filtro-sessao');
            const atual = select.value;
            const sessoesUnicas = [...new Set(todosRegistros.map(r => r.sessaoId).filter(Boolean))];

            select.innerHTML = `<option value="TODAS">Todas as sessões</option>` +
                sessoesUnicas.map(id => `<option value="${id}" ${id === atual ? 'selected' : ''}>${id}</option>`).join('');
        }

        function obterRegistrosFiltrados() {
            const filtro = document.getElementById('filtro-sessao').value;
            if (!filtro || filtro === 'TODAS') return todosRegistros;
            return todosRegistros.filter(r => r.sessaoId === filtro);
        }

        function desenharRota(registrosFiltrados) {
            inicializarMapa();
            camadaRota.clearLayers();
            marcadorAtual = null;

            const validos = registrosFiltrados
                .filter(r => typeof r.latitude === 'number' && typeof r.longitude === 'number')
                .slice()
                .reverse(); // Ordem cronológica: do início ao ponto mais recente

            document.getElementById('info-pontos').textContent = `${validos.length} ponto(s) na rota`;

            if (validos.length === 0) {
                document.getElementById('resumo-rota').textContent = 'Nenhuma coordenada registrada ainda.';
                return;
            }

            const coords = validos.map(r => [r.latitude, r.longitude]);

            // Linha da rota percorrida
            if (coords.length >= 2) {
                L.polyline(coords, {
                    color: '#10b981',
                    weight: 4,
                    opacity: 0.9
                }).addTo(camadaRota);
            }

            // Ponto inicial
            const inicio = validos[0];
            L.circleMarker([inicio.latitude, inicio.longitude], {
                radius: 6,
                color: '#38bdf8',
                fillColor: '#0284c7',
                fillOpacity: 1
            }).bindPopup(`Início (${inicio.dataHora})`).addTo(camadaRota);

            // Ponto mais recente (posição atual)
            const fim = validos[validos.length - 1];
            marcadorAtual = L.circleMarker([fim.latitude, fim.longitude], {
                radius: 8,
                color: '#ffffff',
                fillColor: '#10b981',
                fillOpacity: 1
            }).bindPopup(`Posição atual (${fim.dataHora})`).addTo(camadaRota);

            if (!centralizadoUmaVez || document.getElementById('filtro-sessao').value !== 'TODAS') {
                mapa.setView([fim.latitude, fim.longitude], 15);
                centralizadoUmaVez = true;
            } else {
                mapa.panTo([fim.latitude, fim.longitude]);
            }

            document.getElementById('resumo-rota').textContent =
                `Última posição: ${fim.latitude}, ${fim.longitude} às ${fim.dataHora}`;
        }

        function renderizarTabela(registrosFiltrados) {
            const tbody = document.getElementById('tabela-corpo');
            if (registrosFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Nenhuma captura realizada ainda.</td></tr>`;
                return;
            }

            tbody.innerHTML = registrosFiltrados.map(item => `
                <tr class="hover:bg-gray-750 transition">
                    <td class="p-4 font-mono text-gray-300">${item.dataHora}</td>
                    <td class="p-4 font-mono text-xs text-sky-300">${item.sessaoId || '-'}</td>
                    <td class="p-4 font-mono text-emerald-300">${item.latitude}, ${item.longitude}</td>
                    <td class="p-4 max-w-xs truncate text-xs text-gray-400" title="${item.userAgent}">
                        <div><strong>IP:</strong> ${item.ip}</div>
                        <div class="truncate">${item.userAgent}</div>
                    </td>
                    <td class="p-4">
                        <a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded text-xs font-semibold inline-block">Ver no Mapa</a>
                    </td>
                </tr>
            `).join('');
        }

        function renderizarTudo() {
            const filtrados = obterRegistrosFiltrados();
            desenharRota(filtrados);
            renderizarTabela(filtrados);
        }

        async function carregarRegistros() {
            try {
                const res = await fetch('/api/registros');
                todosRegistros = await res.json();
                atualizarSeletorSessoes();
                renderizarTudo();
            } catch (err) {
                console.error('Erro ao carregar dados:', err);
            }
        }

        async function limparRegistros() {
            if (confirm('Tem certeza que deseja apagar todos os registros?')) {
                await fetch('/api/registros', { method: 'DELETE' });
                centralizadoUmaVez = false;
                carregarRegistros();
            }
        }

        window.onload = () => {
            inicializarMapa();
            carregarRegistros();
        };
        setInterval(carregarRegistros, 4000);
    </script>
</body>
</html>
