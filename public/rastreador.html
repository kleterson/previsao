<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rastreamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">Painel de Capturas</h1>
            <div class="space-x-2">
                <button onclick="carregarRegistros()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition">Atualizar</button>
                <button onclick="limparRegistros()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition">Limpar Histórico</button>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 uppercase text-xs">
                        <tr>
                            <th class="p-4">Data/Hora</th>
                            <th class="p-4">Latitude / Longitude</th>
                            <th class="p-4">IP / Dispositivo</th>
                            <th class="p-4">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="divide-y divide-gray-700">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-400">Carregando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function carregarRegistros() {
            try {
                const res = await fetch('/api/registros');
                const dados = await res.json();
                const tbody = document.getElementById('tabela-corpo');

                if (dados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Nenhuma captura realizada ainda.</td></tr>`;
                    return;
                }

                tbody.innerHTML = dados.map(item => `
                    <tr class="hover:bg-gray-750 transition">
                        <td class="p-4 font-mono text-gray-300">${item.dataHora}</td>
                        <td class="p-4 font-mono text-emerald-300">${item.latitude}, ${item.longitude}</td>
                        <td class="p-4 max-w-xs truncate text-xs text-gray-400" title="${item.userAgent}">
                            <div><strong>IP:</strong> ${item.ip}</div>
                            <div class="truncate">${item.userAgent}</div>
                        </td>
                        <td class="p-4">
                            <a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded text-xs font-semibold inline-block">Ver no Mapa</a>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erro ao carregar dados:', err);
            }
        }

        async function limparRegistros() {
            if (confirm('Tem certeza que deseja apagar todos os registros?')) {
                await fetch('/api/registros', { method: 'DELETE' });
                carregarRegistros();
            }
        }

        window.onload = carregarRegistros;
        setInterval(carregarRegistros, 10000); // Atualiza a cada 10 segundos
    </script>
</body>
</html>
